['Accessibility mode','Add font sizing, high contrast, reduced motion, and screen-reader improvements.'],

const V={
dash(){const nx=L.findIndex((_,i)=>!lessonDone(i)),dl=L.filter((_,i)=>lessonDone(i)).length,de=X.filter((_,i)=>P.e[i]).length;
return`<div class="xp">LEVEL ${Math.floor((dl+de)/3)+1} <i></i> ${dl*100+de*25} XP</div><section class="hero"><h2>Learn the command line, one calm step at a time.</h2><p>No scattered docs, no assumed knowledge. Follow the path from “what is a terminal?” to scripts, networking, and safe real-world workflows.</p><a class="card" href="#/lesson/${nx<0?0:nx}"><b style="font-size:18px">${nx<0?'Review the path':'Continue with lesson '+(nx+1)+': '+L[nx].t}</b><span>${nx<0?'You completed the foundation.':'The next lesson unlocks after you finish this one.'}</span></a></section><h3>Your learning</h3><div class="grid"><div class="card"><b>${dl}/${L.length}</b><span>guided lessons completed</span></div><div class="card"><b>${de}/${X.length}</b><span>practice tasks solved</span></div><div class="card"><b>${P.qa?Math.round(100*P.qc/P.qa)+'%':'—'}</b><span>quiz accuracy</span></div><div class="card"><b>${streak()}</b><span>day streak</span></div></div><h3>How this works</h3><div class="grid"><div class="card step"><span class="step-num">1</span><span><b style="font-size:16px">Learn</b>Read a short lesson and see the command in context.</span></div><div class="card step"><span class="step-num">2</span><span><b style="font-size:16px">Try</b>Use the safe simulated terminal. Nothing touches your computer.</span></div><div class="card step"><span class="step-num">3</span><span><b style="font-size:16px">Prove it</b>Pass the check, then unlock the next step.</span></div></div><h3>What comes after the foundation?</h3><p class="dim">The full roadmap covers ${ROADMAP.length} areas, including the missing essentials: manual pages, exit codes, archives, JSON, Git, SSH safety, portability, and command-injection awareness.</p><a class="card" href="#/lessons"><b style="font-size:17px">View the complete roadmap →</b><span>${ROADMAP.length} modules · ${EXTRA_TOPICS.length} additional essentials</span></a>`},
lessons(){return`<h2>Guided learning path</h2><p class="dim">Finish each lesson’s practice and quiz to unlock the next one. The guided lessons are the starting spine; the complete roadmap keeps every command and concept in one place.</p><div>${L.map((x,i)=>{const done=lessonDone(i),open=lessonAvailable(i);return open?`<a class="card" style="margin:10px 0" href="#/lesson/${i}"><span class="tag">${String(i+1).padStart(2,'0')} · ${x.mod}</span><b style="font-size:18px;margin-top:8px">${x.t}</b><span class="${done?'ok':''}">${done?'✓ completed':i===0?'Start here':'Next lesson'}</span></a>`:`<div class="card" style="margin:10px 0;opacity:.55"><span class="tag">${String(i+1).padStart(2,'0')} · locked</span><b style="font-size:18px;margin-top:8px">${x.t}</b><span>Complete lesson ${i} to unlock</span></div>`}).join('')}</div><h3>Complete command-line roadmap</h3><p class="dim">Topics are grouped in the order a learner needs them. Each module will become a richer lesson, exercise, or project as the curriculum grows.</p><div>${ROADMAP.map(([title,topics])=>`<div class="card" style="margin:10px 0"><b style="font-size:16px">${title}</b><span>${topics}</span></div>`).join('')}</div><h3>Extra essentials added</h3><div class="row">${EXTRA_TOPICS.map(x=>`<span class="tag">${x}</span>`).join('')}</div><h3>Project roadmap</h3><div class="grid">${IDEAS.map(([title,description])=>`<div class="card"><b style="font-size:16px">${title}</b><span>${description}</span></div>`).join('')}</div>`},
lesson(i){const x=L[i];if(!x)return'Not found';const S=(h,t)=>`<h3>${h}</h3><div>${t.replace(/\n/g,'<br>')}</div>`,st=P.l[i]||{};
return`<a href="#/lessons" class="dim">← Lessons</a><h2>${x.t}</h2><span class="tag">${x.mod}</span>${S('A. Learning objectives',x.obj)}${S('B. What is it?',x.what)}${S('C. Why does it exist?',x.why)}${S('D. When is it used?',x.when)}${S('E. Syntax breakdown','<pre>'+x.syn+'</pre>')}${S('F–G. Examples and expected output','<pre>'+x.ex+'</pre>')}${S('H. Common mistakes',x.mist)}${S('I. Real-world application',x.real)}
<h3>J. Interactive practice ${st.p?'<span class="ok">✓ done</span>':''}</h3><div class="msg">Task: ${x.task}</div><div class="row"><button id="rs">Reset environment</button></div><div id="tb"></div>
<h3>K. Knowledge check ${st.q?'<span class="ok">✓ done</span>':''}</h3><div>${x.q[0]}</div><div class="row">${x.q[1].map((o,k)=>`<button data-k="${k}">${o}</button>`).join('')}</div><div id="qf"></div>
<h3>L. Completion</h3><div id="cf">${lessonDone(i)?'<span class="ok">Lesson complete.</span>':'Pass the practice and the quiz to complete this lesson.'}</div>`},
practice(){return`<h2>Practice Lab</h2><p class="dim">Each exercise starts from a fresh simulated filesystem.</p>${X.map((x,i)=>`<a class="card" style="margin:8px 0" href="#/ex/${i}"><span class="tag">${x.lv}</span> ${x.t} <span class="ok">${P.e[i]?'✓':''}</span></a>`).join('')}`},
ex(i){const x=X[i];if(!x)return'Not found';return`<a href="#/practice" class="dim">← Practice Lab</a><h2>${x.lv} exercise ${i+1}</h2><div class="msg">${x.t}</div><div class="row"><button id="hint">Show hint</button><button id="rs">Retry (reset)</button></div><div id="hf" class="warn"></div><div id="tb"></div><div id="xf"></div>`},
play(){return`<h2>Playground</h2><p class="dim">Explore freely in a safe simulated terminal. This is optional; the guided path is the best place to start.</p><div class="row"><button id="rs">Reset environment</button></div><div id="tb"></div>`},
progress(){return`<h2>Progress</h2><p class="dim">Your progress is stored locally in this browser for now.</p><div class="grid"><div class="card"><b>${Object.keys(P.l).filter(lessonDone).length}/${L.length}</b><span>lessons complete</span></div><div class="card"><b>${Object.keys(P.e).length}/${X.length}</b><span>practice tasks</span></div><div class="card"><b>${P.qc}/${P.qa}</b><span>quiz answers correct</span></div></div><div class="hero"><h3>Want to use this on more than one device?</h3><p>Sign in with Google to sync your progress. If this open-source deployment has no Firebase config yet, the app keeps working locally and tells you what to configure.</p><button id="google" class="pri">Sign in with Google</button><div id="gf" class="dim"></div></div>
<h3>Badges</h3><div class="row">${[[Object.keys(P.l).some(lessonDone),'First lesson'],[Object.keys(P.e).length>=5,'5 exercises'],[L.every((_,i)=>lessonDone(i)),'All lessons'],[streak()>=3,'3-day streak']].map(b=>`<span class="tag ${b[0]?'ok':''}">${b[0]?'★':'☆'} ${b[1]}</span>`).join('')}</div><div class="row"><button id="rp">Reset all progress</button></div>`}};
function bind(r,a){const m=$('#m'),on=(s,f)=>{const e=m.querySelector(s);e&&(e.onclick=f)};
if(r=='lesson'){const x=L[a];if(!x||!lessonAvailable(+a)){location.hash='#/lessons';return}rst();const tk={check:x.check},chk=()=>{if(lessonDone(a))$('#cf').innerHTML='<span class="ok">Lesson complete.</span>'};
taskTerm($('#tb'),tk,()=>{P.l[a]=Object.assign(P.l[a]||{},{p:1});save();$('#tb').insertAdjacentHTML('afterend','<div class="ok">✓ Practice passed.</div>');chk()});
on('#rs',()=>{rst();taskTerm($('#tb'),tk,()=>{P.l[a]=Object.assign(P.l[a]||{},{p:1});save();chk()})});
m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k==x.q[2];P.qa++;if(ok){P.qc++;P.l[a]=Object.assign(P.l[a]||{},{q:1})}save();$('#qf').innerHTML=ok?'<span class="ok">Correct.</span>':'<span class="er">Not quite. Re-read the syntax breakdown and try again.</span>';chk()})}
if(r=='ex'){const x=X[a];if(!x)return;let h=0;const go=()=>{rst();const tk={check:x.check};taskTerm($('#tb'),tk,()=>{P.e[a]=1;save();$('#xf').innerHTML='<div class="msg ok">✓ Solved. '+x.why+'</div>'})};go();
on('#hint',()=>{$('#hf').textContent='Hint: '+x.hint});on('#rs',()=>{$('#xf').innerHTML='';go()})}
if(r=='play'){term($('#tb'));on('#rs',()=>{rst();term($('#tb'))})}
if(r=='tutor'){const ask=()=>{const q=$('#tq').value.trim();if(!q)return;const d=document.createElement('div');d.className='msg';d.textContent='You: '+q+'\n\n'+tutor($('#md').value,q);$('#tl').prepend(d);$('#tq').value=''};on('#ta',ask);$('#tq').onkeydown=e=>e.key=='Enter'&&ask()}
if(r=='ref'){const draw=()=>{const q=$('#rq').value.toLowerCase();$('#rl').innerHTML=Object.entries(R).filter(([k,v])=>!q||(k+v.join(' ')).toLowerCase().includes(q)).map(([k,v])=>`<div class="card" style="margin:8px 0"><b class="mono" style="font-size:16px">${k}</b>${v[0]}<pre>${v[1]}\n${v[2]}</pre><span>Platforms: ${v[3]}<br>Common error: ${v[4]}<br>Related: ${v[5]}</span></div>`).join('')||'No match.'};$('#rq').oninput=draw;draw()}
if(r=='progress'){on('#google',async()=>{const b=$('#google');b.disabled=true;$('#gf').textContent='Connecting to Google…';try{$('#gf').textContent='Signed in as '+await syncWithGoogle()+'. Progress synced.';render()}catch(e){b.disabled=false;$('#gf').textContent=e.message}});on('#rp',()=>{if(confirm('Reset all progress?')){P=dflt();save();render()}})}}
const $=s=>document.querySelector(s);
function render(){const[r,a]=(location.hash.slice(2)||'dash').split('/'),k=V[r]?r:'dash';$('#nav').querySelectorAll('a').forEach(e=>e.remove());
$('#nav').insertAdjacentHTML('beforeend',NAV.map(([h,t])=>`<a href="#/${h}" class="${(k==h||(k=='lesson'&&h=='lessons')||(k=='ex'&&h=='practice'))?'on':''}">${t}</a>`).join(''));
$('#m').innerHTML=V[k](a===undefined?a:+a);bind(k,a===undefined?a:+a);scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
